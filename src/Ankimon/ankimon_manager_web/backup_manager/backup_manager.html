<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Backup Manager</title>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../../ankimon_items_web/shop.css?v=20260634">
	<link rel="stylesheet" href="../../ankimon_items_web/nav-switcher.css?v=20260634">
	<link rel="stylesheet" href="backup_manager.css?v=20260634">
	<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body class="dark-mode">
	<div class="app-container">
		<aside class="sidebar">
			<div class="sidebar-header">
				<div id="nav-switcher" class="nav-switcher">
					<button id="nav-trigger" class="nav-trigger" type="button" aria-haspopup="true" aria-expanded="false">
						<img src="../../user_files/sprites/items/skull-fossil.png" class="app-logo icon-item-sprite" alt="">
						<h1>BACKUP MANAGER</h1>
						<span class="nav-chevron">▾</span>
					</button>
					<div id="nav-menu" class="nav-menu hidden" role="menu">

			<header class="top-bar"><div class="top-bar-titles"><h2>Backup Manager</h2></div><div class="top-actions"><button id="close-btn" class="btn btn-secondary">Close</button></div></header>
